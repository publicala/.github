# Centralized secret-leak detection for every publica.la repo.
#
# This workflow is the SINGLE source of truth for gitleaks across the org. It
# lives in the org's shared .github repository and is enforced fleet-wide by an
# organization repository ruleset ("Require workflows to pass before merging")
# that targets all repositories and points at THIS workflow — so it runs on
# every targeted repo's pull requests without any file committed into those
# repos. Tuning happens here, once.
#
# Design choices:
#   * We run the MIT-licensed gitleaks BINARY directly. The gitleaks-action
#     wrapper requires a paid license for organization/private repos; the
#     binary does not. The release tarball is checksum-pinned and actions are
#     SHA-pinned, since this workflow gates the whole fleet.
#   * The detection config is written inline (no separate committed file, no
#     cross-repo private checkout to fetch it).
#   * Scans are scoped to the PR / push COMMIT RANGE, never full history. A
#     repo's pre-existing historical secrets therefore do not mass-fail every
#     PR on rollout day — only newly introduced secrets block a merge. When a
#     range endpoint is unresolvable (force-push that orphans the old tip, the
#     initial push to a default branch, or manual dispatch) the run falls back
#     to a full scan — the one-time chance to catch what is already there, and
#     the fail-safe that keeps an unresolvable range from silently passing.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so commit ranges resolve)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "${RUNNER_TEMP}/${TARBALL}" gitleaks
          gitleaks version

      - name: Write org gitleaks config
        run: |
          cat > "${RUNNER_TEMP}/gitleaks.toml" <<'TOML'
          title = "publica.la gitleaks config"

          [extend]
          useDefault = true

          # publica.la issues its credentials with distinctive, greppable prefixes
          # (the "pla_" convention) precisely so a scanner can catch a leaked one.
          # Each rule keyword-gates on its prefix, then matches the 40-char random
          # tail. Each carries a rule-scoped allowlist for documentation
          # placeholders so a global path allowlist never silences default rules.

          [[rules]]
          id = "pla-api-token"
          description = "publica.la API token (pla_data_ prefix)"
          regex = '''pla_data_[A-Za-z0-9]{40}'''
          keywords = ["pla_data_"]

            [[rules.allowlists]]
            description = "Documentation placeholders and obvious dummy tokens"
            regexTarget = "match"
            regexes = [
              '''pla_data_(?:EXAMPLE|example|FAKE|fake|TEST|test|SAMPLE|sample|x{4,})[A-Za-z0-9]*''',
            ]
            paths = [
              '''(^|/)\.env\.example$''',
              '''(^|/)phpunit\.xml$''',
            ]

          [[rules]]
          id = "pla-internal-api-token"
          description = "publica.la internal service-to-service API token (pla_int_ prefix)"
          regex = '''pla_int_[A-Za-z0-9]{40}'''
          keywords = ["pla_int_"]

            [[rules.allowlists]]
            description = "Documentation placeholders and obvious dummy tokens"
            regexTarget = "match"
            regexes = [
              '''pla_int_(?:EXAMPLE|example|FAKE|fake|TEST|test|SAMPLE|sample|x{4,})[A-Za-z0-9]*''',
            ]
            paths = [
              '''(^|/)\.env\.example$''',
              '''(^|/)phpunit\.xml$''',
            ]

          # Global allowlists, each scoped via targetRules to specific default
          # rules and narrowed with condition = "AND" so every listed criterion
          # must match. Never add an unscoped global path allowlist: it would
          # silence every rule (including provider-specific ones) for the
          # matched paths.

          # Composer license-key registries authenticate via http-basic, whose
          # username/password lines are the only thing this skips. The regex is
          # anchored so the line contains nothing but that one field: an
          # unrelated secret sharing the line (minified JSON) keeps the finding.
          # Composer pretty-prints auth.json, so legit files match; a minified
          # file merely loses the exception and gets flagged, which fails safe.
          # Bearer, github-oauth, and gitlab-token entries keep the shape
          # "host": "token" and stay scannable, as do provider-specific rules.
          [[allowlists]]
          description = "Composer auth.json http-basic entries hold package-registry license keys committed deliberately"
          targetRules = ["generic-api-key"]
          condition = "AND"
          paths = ['''(^|/)auth\.json$''']
          regexTarget = "line"
          regexes = ['''^\s*"(?:username|password)"\s*:\s*"[^"]*"\s*,?\s*$''']

          [[allowlists]]
          description = "Placeholder-shaped values in documentation and test paths"
          targetRules = ["generic-api-key", "curl-auth-header"]
          condition = "AND"
          paths = [
            '''\.mdx?$''',
            '''(^|/)tests?/''',
            '''(^|/)fixtures?/''',
            '''(^|/)examples?/''',
            '''(^|/)docs?/''',
          ]
          regexTarget = "secret"
          regexes = ['''(?i)^(?:test|dummy|example|sample|fake|placeholder|changeme|your)[-_.]''']
          TOML

      - name: Resolve scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          # A range is safe to hand gitleaks only if BOTH endpoints resolve to a
          # commit in the fetched history. gitleaks 8.30.1 exits 0 (scanning
          # nothing) on an unresolvable --log-opts range, so an unverified range
          # is a silent pass. When an endpoint is missing — a force-push orphans
          # the old tip, a branch delete sends the zero SHA — we drop to a full
          # scan, which cannot miss a newly introduced secret.
          resolves() { [ -n "${1:-}" ] && [ "$1" != "$ZERO" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            if resolves "$PR_BASE" && resolves "$PR_HEAD"; then
              RANGE="${PR_BASE}..${PR_HEAD}"
            fi
          elif [ "$EVENT" = "push" ]; then
            if resolves "$PUSH_BEFORE" && resolves "$PUSH_AFTER"; then
              RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          fi

          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: ${RANGE}"
          else
            echo "No resolvable range (first push, force-push, or manual dispatch): scanning full history"
          fi
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # --redact masks secret values in output; -v prints each finding's
          # rule, file, and commit so a failed run is diagnosable from the log.
          ARGS=(git . --config "${RUNNER_TEMP}/gitleaks.toml" --no-banner --redact -v)

          # git log emits no patch for merge commits by default, so without
          # --diff-merges a secret typed while resolving a merge conflict (or
          # slipped into an "evil merge") never reaches the scanner at all.
          # remerge diffs the recorded merge result against a mechanical
          # re-merge of its parents: exactly the human-introduced content.
          # A clean merge produces an empty diff, so routine update-branch
          # merges on PRs add no noise from already-merged history.
          MERGES=--diff-merges=remerge

          if [ -n "${RANGE}" ]; then
            ARGS+=(--log-opts="${MERGES} ${RANGE}")
          else
            # Mirror gitleaks' own full-scan defaults — it applies them only
            # when --log-opts is absent — then add the merge-diff flag.
            ARGS+=(--log-opts="--full-history --all --diff-filter=tuxdb ${MERGES}")
          fi
          echo "+ gitleaks ${ARGS[*]}"
          gitleaks "${ARGS[@]}"
