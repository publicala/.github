name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  action:
    name: Test gate action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run check-bundle

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint

      - name: Lint workflows
        # actionlint 1.7.12 does not know GitHub's $/ self-repository syntax.
        run: ./actionlint -ignore 'specifying action "\$/.*" in invalid format because ref is missing' -color

  ci-success:
    name: ci-success
    if: always()
    needs: action
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          ACTION_RESULT: ${{ needs.action.result }}
        run: test "$ACTION_RESULT" = success
