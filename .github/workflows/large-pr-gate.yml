name: Large PR Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: large-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Large PR approval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate pull request size
        uses: $/.github/actions/large-pr-gate
        with:
          repository-token: ${{ github.token }}
          max-lines: '20000'
