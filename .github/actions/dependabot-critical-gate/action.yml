name: Dependabot Critical Gate
description: Blocks merges that do not reduce overdue Critical Dependabot alerts.

inputs:
  alerts-token:
    description: Repository-scoped GitHub App token with Dependabot alerts read access.
    required: true
  repository-token:
    description: GITHUB_TOKEN with contents and pull request read access.
    required: true
  sla-hours:
    description: Grace period before a Critical alert blocks merges.
    default: '168'
  acceptance-file:
    description: Repository path for reviewed alert acceptances.
    default: .github/security/dependabot-accepted.yml

outputs:
  base-blocked-count:
    description: Number of overdue, unaccepted Critical alerts on the base branch.
  candidate-blocked-count:
    description: Number of overdue, unaccepted Critical alerts after the candidate merge.

runs:
  using: node24
  main: dist/index.cjs
